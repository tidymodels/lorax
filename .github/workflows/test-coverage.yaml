# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: test-coverage.yaml

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::covr
            any::xml2
            catboost=?ignore
          needs: coverage

      # catboost is not on CRAN; pak is told to ignore it above and the
      # binary release is installed from GitHub here.
      - name: Install catboost
        run: |
          version <- "1.2.10"
          sysname <- tolower(Sys.info()[["sysname"]])
          if (sysname == "darwin") {
            platform <- "darwin-universal2"
          } else if (sysname == "windows") {
            platform <- "windows-x86_64"
          } else if (R.version$arch == "aarch64") {
            platform <- "linux-aarch64"
          } else {
            platform <- "linux-x86_64"
          }
          url <- sprintf(
            "https://github.com/catboost/catboost/releases/download/v%s/catboost-R-%s-%s.tgz",
            version,
            platform,
            version
          )
          path <- file.path(tempdir(), basename(url))
          download.file(url, path, mode = "wb")
          install.packages(
            path,
            repos = NULL,
            type = "source",
            INSTALL_opts = c("--no-multiarch", "--no-test-load", "--no-staged-install")
          )
          library(catboost)
        shell: Rscript {0}

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6
        with:
          # Fail if error if not on PR, or if on PR and token is given
          fail_ci_if_error: ${{ github.event_name != 'pull_request' || secrets.CODECOV_TOKEN }}
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package

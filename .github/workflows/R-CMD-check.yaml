# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# NOTE: This workflow is overkill for most R packages and
# check-standard.yaml is likely a better choice.
# usethis::use_github_action("check-standard") will install it.
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
          - {os: ubuntu-latest,  r: 'oldrel-2'}
          - {os: ubuntu-latest,  r: 'oldrel-3'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            catboost=?ignore
          needs: check

      # catboost is not on CRAN; pak is told to ignore it above and the
      # binary release is installed from GitHub here.
      - name: Install catboost
        run: |
          version <- "1.2.10"
          sysname <- tolower(Sys.info()[["sysname"]])
          if (sysname == "darwin") {
            platform <- "darwin-universal2"
          } else if (sysname == "windows") {
            platform <- "windows-x86_64"
          } else if (R.version$arch == "aarch64") {
            platform <- "linux-aarch64"
          } else {
            platform <- "linux-x86_64"
          }
          url <- sprintf(
            "https://github.com/catboost/catboost/releases/download/v%s/catboost-R-%s-%s.tgz",
            version,
            platform,
            version
          )
          path <- file.path(tempdir(), basename(url))
          download.file(url, path, mode = "wb")
          install.packages(
            path,
            repos = NULL,
            type = "source",
            INSTALL_opts = c("--no-multiarch", "--no-test-load", "--no-staged-install")
          )
          library(catboost)
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

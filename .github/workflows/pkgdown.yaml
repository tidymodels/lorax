# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
            local::.
            catboost=?ignore
          needs: website

      # catboost is not on CRAN; pak is told to ignore it above and the
      # binary release is installed from GitHub here.
      - name: Install catboost
        run: |
          version <- "1.2.10"
          sysname <- tolower(Sys.info()[["sysname"]])
          if (sysname == "darwin") {
            platform <- "darwin-universal2"
          } else if (sysname == "windows") {
            platform <- "windows-x86_64"
          } else if (R.version$arch == "aarch64") {
            platform <- "linux-aarch64"
          } else {
            platform <- "linux-x86_64"
          }
          url <- sprintf(
            "https://github.com/catboost/catboost/releases/download/v%s/catboost-R-%s-%s.tgz",
            version,
            platform,
            version
          )
          path <- file.path(tempdir(), basename(url))
          download.file(url, path, mode = "wb")
          install.packages(
            path,
            repos = NULL,
            type = "source",
            INSTALL_opts = c("--no-multiarch", "--no-test-load", "--no-staged-install")
          )
          library(catboost)
        shell: Rscript {0}

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
